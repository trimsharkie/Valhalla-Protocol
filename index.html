<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Valhalla Protocol</title>

    <link rel="stylesheet" href="./style.css?v=34">
    <link rel="manifest" href="/Valhalla-Protocol/manifest.json">
    <link rel="icon" href="/Valhalla-Protocol/icon-512.png">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <meta name="theme-color" content="#000000">
</head>
<body>

    <div id="loginScreen">

        <div class="login-art-wrapper">

            <img
                src="./assets/valhalla-login-drengr-new.png"
                class="login-art-full"
                alt="Valhalla Protocol"
            >

            <input
                id="loginEmail"
                class="art-email"
                type="email"
                placeholder="Username"
                autocomplete="email"
            >

            <input
                id="loginPassword"
                class="art-password"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
            >
            
            <button
                type="button"
                class="art-pw-toggle"
                aria-label="Wachtwoord tonen/verbergen"
                onclick="(function(){var i=document.getElementById('loginPassword');i.type=i.type==='password'?'text':'password';})()"
            >👁</button>

            <button id="loginBtn" class="art-login-btn" aria-label="Enter Valhalla"></button>


        </div>

        <p id="authMessage"></p>

    </div>

    <div id="appScreen" style="display:none;">

        <button id="logoutBtn">Uitloggen</button>

        <div class="tabs">
            <button onclick="showTab('trainingTab')">⚔️ Nieuwe Training</button>
            <button onclick="showTab('historyTab')">📜 Historie</button>
            <button onclick="showTab('recordsTab')">🏆 Records</button>
            <button onclick="showTab('dashboardTab')">📊 Dashboard</button>
            <button onclick="showTab('progressTab')">📈 Progressie</button>
            <button onclick="showTab('calendarTab')">📅 Kalender</button>
        </div>

        <div id="trainingTab">
            <label>Training type</label>
            <select id="trainingType">
                <option>Upper</option>
                <option>Lower</option>
                <option>Full Body</option>
                <option>Cardio</option>
                <option>Custom</option>
            </select>

            <h2>Oefening toevoegen</h2>
            <input id="newExercise" placeholder="Nieuwe oefening toevoegen">
            <button onclick="addExercise()">Oefening opslaan</button>
            <button onclick="deleteExercise()">Oefening verwijderen</button>

            <h2>Set toevoegen</h2>
            <select id="exercise"></select>

            <div id="lastPerformance"></div>

            <br>

            <input id="weight" type="number" placeholder="KG">
            <input id="reps" type="number" placeholder="Reps">

            <button onclick="addSet()">Set toevoegen</button>

            <h2>Training log</h2>
            <div id="setList"></div>

            <h2>Opmerking</h2>
            <textarea id="notes" placeholder="Opmerkingen, klachten, pomp, PR, etc."></textarea>

            <button onclick="clearTraining()">Nieuwe training</button>
            <button onclick="saveTraining()">Training opslaan</button>

        </div>

        <div id="historyTab" style="display:none;">
            <h2>📜 Opgeslagen trainingen</h2>
            <div id="historyList"></div>
        </div>

        <div id="recordsTab" style="display:none;">
            <h2>🏆 Records</h2>
            <div id="recordsList"></div>
        </div>

        <div id="dashboardTab" style="display:none;">
            <h2>📊 Dashboard</h2>
            <div id="dashboard"></div>
        </div>

        <div id="progressTab" style="display:none;">
            <h2>📈 Progressie</h2>

            <label>Kies oefening</label>
            <select id="progressExercise" onchange="renderProgress()"></select>

            <div id="progressList"></div>
            <canvas id="progressChart"></canvas>
        </div>

        <div id="calendarTab" style="display:none;">
            <h2>📅 Kalender</h2>

            <button onclick="changeCalendarMonth(-1)">⬅️ Vorige maand</button>
            <button onclick="changeCalendarMonth(1)">Volgende maand ➡️</button>

            <h3 id="calendarTitle"></h3>
            <div id="calendar"></div>
            <div id="calendarDetails"></div>
        </div>

    </div>

    <script src="./app.js?v=34"></script>
    <script type="module" src="./firebase.js"></script>
    <script type="module" src="./auth.js"></script>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/Valhalla-Protocol/service-worker.js?v=34")
                .then(() => console.log("Service worker geregistreerd"))
                .catch(error => console.error("Service worker fout:", error));
        }
    </script>

</body>
</html>
